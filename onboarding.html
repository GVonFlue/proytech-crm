<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- a client's onboarding is private: never indexed, never leaks a referrer -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Onboarding</title>
    <!-- the proposal's two faces: Space Grotesk for display, Inter for text.
         display=swap so a slow font never hides the form itself. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <meta name="theme-color" content="#F7FAFF" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  </head>
  <body style="margin:0;background:#F7FAFF">
    <div id="root"></div>
    <script type="module" src="/src/onboarding/main.jsx"></script>
  </body>
</html>
